name: Database Migrations Release
on:
  # push-only on purpose — do not add workflow_dispatch back. `gh workflow run --ref <branch>`
  # runs *that branch's* copy of this file, so a dispatch trigger lets any branch push a
  # version with the guard and `environment:` deleted and run it against the database. With
  # only `push: release`, this workflow can never execute code from another ref.
  push: # Runs AFTER merge to release (never during PR review!)
    branches:
      - release

permissions:
  contents: read # only needs to check out the repo to run migrations

jobs:
  migrate:
    name: Run Database Migrations
    # Defence in depth only — the control is the credential: DATABASE_URL_PROD must exist
    # as a **Production** environment secret (never repo- or org-scoped), because a branch
    # can edit this YAML but cannot attach the reviewer-gated environment to its own copy.
    if: github.ref == 'refs/heads/release'
    runs-on: warp-ubuntu-latest-arm64-4x
    environment: Production
    steps:
      - name: Checkout repository
        uses: actions/checkout@08eba0b27e820071cde6df949e0beb9ba4906955 # v4.3.0

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: '1.4.4'

      - name: Install DB dependencies
        working-directory: packages/db
        run: bun install --frozen-lockfile --ignore-scripts

      - name: Apply database migrations
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL_PROD }}
        working-directory: packages/db
        run: bunx prisma migrate deploy
