name: Generate
# Generated by `speakeasy configure github`. The MCP server lives at
# apps/mcp-server in this monorepo, so we pass `working_directory: apps/mcp-server`
# to point Speakeasy's action at the .speakeasy/workflow.yaml there.
#
# WHY THIS FILE IS HERE AND NOT UNDER apps/mcp-server/.github/workflows/:
# GitHub Actions only reads workflow files from `.github/workflows/` at the
# repository root. Speakeasy's `configure github` command writes the workflow
# next to the speakeasy config (apps/mcp-server/.github/workflows/), which is
# the wrong path for GH to pick it up — so we moved it here. If you re-run
# `speakeasy configure github`, delete the duplicate it creates under
# apps/mcp-server/.github/ and keep this one.
#
# WHY THE STEPS ARE INLINED INSTEAD OF `uses: speakeasy-api/.../workflow-executor.yaml`:
# the reusable workflow builds Speakeasy's action image itself, and that action
# downloads the newest Speakeasy CLI on every run. These are the executor's
# `pr` mode steps (v15.60.11), run on the image built by prepare-speakeasy,
# which carries the CLI version pinned in .speakeasy/workflow.yaml.
permissions:
  checks: write
  contents: write
  pull-requests: write
  statuses: write
  id-token: write
"on":
  workflow_dispatch:
    inputs:
      force:
        description: Force generation of SDKs
        type: boolean
        default: false
      set_version:
        description: optionally set a specific SDK version
        type: string
  schedule:
    - cron: 0 0 * * *
  pull_request:
    types:
      - labeled
      - unlabeled
jobs:
  generate:
    name: Generate Target
    # Label events regenerate only for a version-bump label the PR body does not
    # already record.
    if: >-
      github.event_name != 'pull_request' ||
      (contains(fromJSON('["patch","minor","major","graduate"]'), github.event.label.name) &&
      !(github.event.action == 'labeled' &&
      contains(github.event.pull_request.body, format('Version Bump Type: [{0}]', github.event.label.name))))
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@08eba0b27e820071cde6df949e0beb9ba4906955 # v4.3.0
        with:
          persist-credentials: false
      - name: Prepare pinned Speakeasy action
        id: speakeasy
        uses: ./.github/actions/prepare-speakeasy
        with:
          working-directory: apps/mcp-server
      - id: run-workflow
        name: Run Generation Workflow
        uses: ./_speakeasy
        with:
          action: run-workflow
          # Recorded in the regeneration commit message.
          speakeasy_version: ${{ steps.speakeasy.outputs.speakeasy-version }}
          mode: pr
          force: ${{ github.event.inputs.force }}
          set_version: ${{ github.event.inputs.set_version }}
          working_directory: apps/mcp-server
          enable_sdk_changelog: true
          # The action installs these with pipx before generating.
          poetry_version: 2.2.1
          uv_version: 0.13.8
          github_access_token: ${{ secrets.GITHUB_TOKEN }}
          speakeasy_api_key: ${{ secrets.SPEAKEASY_API_KEY }}
      - id: log-result
        name: Log Generation Output
        uses: ./_speakeasy
        with:
          action: log-result
          working_directory: apps/mcp-server
          github_access_token: ${{ secrets.GITHUB_TOKEN }}
          speakeasy_api_key: ${{ secrets.SPEAKEASY_API_KEY }}
        env:
          GH_ACTION_RESULT: ${{ job.status }}
          RESOLVED_SPEAKEASY_VERSION: ${{ steps.run-workflow.outputs.resolved_speakeasy_version }}
          GH_ACTION_VERSION: fa50f4813201c6f919c74c25196b17c070ec4ac1
          GH_ACTION_STEP: ${{ github.job }}
