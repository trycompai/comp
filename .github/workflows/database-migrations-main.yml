name: Database Migrations Main
on:
  push: # Runs AFTER merge to main (never during PR review!)
    branches:
      - main
  # dispatch kept: staging migrations from a ref are a normal operator action. The ref guard
  # below is not what protects this workflow — the `staging` environment is (see comment there).
  workflow_dispatch: # Allows manual triggering

permissions:
  contents: read # only needs to check out the repo to run migrations

jobs:
  migrate:
    name: Run Database Migrations
    # Defence in depth only — the control is the credential: DATABASE_URL_DEV must exist as
    # a **staging** environment secret (never repo- or org-scoped), because workflow_dispatch
    # accepts any --ref and runs that branch's copy of this YAML, guard and all.
    if: github.ref == 'refs/heads/main'
    runs-on: warp-ubuntu-latest-arm64-4x
    environment: staging
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: '1.4.4'

      - name: Install DB dependencies
        working-directory: packages/db
        run: bun install --frozen-lockfile --ignore-scripts

      - name: Apply database migrations
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL_DEV }}
        working-directory: packages/db
        run: bunx prisma migrate deploy
