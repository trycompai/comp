########################################################################################
# "bun install" composite action                                                       #
#--------------------------------------------------------------------------------------#
# Cache:                                                                               #
#   - Downloaded packages cache                                                        #
#   - node_modules directory                                                           #
########################################################################################

name: 'Bun install'
description: 'Run bun install with cache enabled'
inputs:
  node_version:
    description: 'Node.js version to use'
    required: false
    default: v20.x

runs:
  using: 'composite'
  steps:
    - name: Use Node ${{ inputs.node_version }}
      uses: buildjet/setup-node@6131e76b005f1e3f5c721e0ca2d8279eb577c3a8 # v4.0.4
      with:
        node-version: ${{ inputs.node_version }}

    - name: Install Bun
      uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
      with:
        bun-version: latest

    # Cache bun's package cache
    - name: Restore Bun cache
      uses: buildjet/cache@3e70d19e31d6a8030aeddf6ed8dbe601f94d09f4 # v4.0.2
      id: bun-cache
      with:
        path: ~/.bun/install/cache
        key: bun-cache-${{ hashFiles('bun.lockb', 'package.json') }}
        restore-keys: bun-cache-

    # Cache node_modules
    - name: Restore node_modules
      id: bun-nm-cache
      uses: buildjet/cache@3e70d19e31d6a8030aeddf6ed8dbe601f94d09f4 # v4.0.2
      with:
        path: '**/node_modules/'
        key: ${{ runner.os }}-bun-nm-cache-${{ hashFiles('bun.lockb', 'package.json') }}

    - name: Install dependencies
      shell: bash
      run: |
        bun install
        bun prisma generate
