########################################################################################
# "npm install" composite action                                                       #
#--------------------------------------------------------------------------------------#
# Cache:                                                                               #
#   - npm cache                                                                        #
#   - node_modules directory                                                           #
########################################################################################

name: 'npm install'
description: 'Run npm ci (fallback: npm install) with cache enabled'
inputs:
  node_version:
    description: 'Node.js version to use'
    required: false
    default: v22.x

runs:
  using: 'composite'
  steps:
    - name: Use Node ${{ inputs.node_version }}
      uses: actions/setup-node@v4
      with:
        node-version: ${{ inputs.node_version }}
        cache: npm

    # Cache node_modules
    - name: Restore node_modules
      id: nm-cache
      uses: buildjet/cache@v4
      with:
        path: '**/node_modules/'
        key: ${{ runner.os }}-npm-nm-cache-${{ hashFiles('package-lock.json', 'package.json') }}

    - name: Install dependencies
      shell: bash
      run: |
        npm ci || npm install
        npx prisma generate
